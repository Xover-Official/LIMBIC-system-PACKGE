[project]
name = "limbic-system"
version = "0.1.0"
description = "A biomimetic Limbic System for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "faiss-cpu>=1.7.4",
    "sqlalchemy>=2.0.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "aiosqlite>=0.19.0",
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "plotly>=5.17.0"
]

[project.scripts]
limbic = "limbic.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
