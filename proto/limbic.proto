syntax = "proto3";

package limbic;

service LimbicService {
  rpc InjectStimulus (StimulusRequest) returns (LimbicResponse);
  rpc GetLimbicState (Empty) returns (LimbicState);
  rpc StreamState (Empty) returns (stream LimbicState);
  rpc GetPlans (Empty) returns (PlanList);
}

service WorkingMemoryService {
  rpc SetItem (WorkingMemoryItem) returns (WorkingMemoryResponse);
  rpc GetItems (Empty) returns (WorkingMemoryList);
  rpc Clear (Empty) returns (WorkingMemoryResponse);
}

message PlanList {
  repeated Plan plans = 1;
}

message Plan {
  string action = 1;
  float confidence = 2;
  float utility = 3;
  bool approved = 4;
  string status = 5;
}

message CandidatePlan {
  string id = 1;
  string action = 2;
  float probability = 3;
  float predicted_utility = 4;
}

message CandidatePlanList {
  repeated CandidatePlan plans = 1;
}

message Empty {}

message StimulusRequest {
  string source = 1;
  string content = 2;
  repeated float embedding = 3;
  map<string, float> metadata = 4;
}

message LimbicResponse {
  bool accepted = 1;
  string message = 2;
}

message LimbicState {
  float arousal = 1;
  float valence = 2;
  map<string, float> drives = 3;
  map<string, float> emotions = 4;
  string dominant_engine = 5;
  int64 timestamp = 6;
  ConsciousState consciousness = 7;
  map<string, float> hormones = 8;
  float phi = 9;
  float ego_coherence = 10;
  float meaning = 11;
  float dread = 12;
}

message ConsciousState {
  string current_focus = 1;
  float focus_salience = 2;
  string self_narrative = 3;
  map<string, float> attention_schema = 4;
}

message WorkingMemoryItem {
  string key = 1;
  string value = 2;
  float decay = 3;
  int64 timestamp = 4;
}

message WorkingMemoryList {
  repeated WorkingMemoryItem items = 1;
}

message WorkingMemoryResponse {
  bool success = 1;
}
